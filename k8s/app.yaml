apiVersion: v1
kind: ConfigMap
metadata:
  name: parser-backend-config
  namespace: resume-parser
data:
  GEMINI_MODEL: gemini-2.5-flash-lite
  MAX_FILE_MB: "10"
  LOG_LEVEL: INFO
  CORS_ORIGINS: '["http://localhost:5173"]'
  SHORTLIST_AGENT_URL: http://shortlist-agent:8001
  SHORTLIST_TIMEOUT_SECONDS: "60"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shortlist-agent-config
  namespace: resume-parser
data:
  QDRANT_URL: http://qdrant:6333
  LOG_LEVEL: INFO
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: parser-frontend-config
  namespace: resume-parser
data:
  VITE_API_BASE: /api
  VITE_PROXY_TARGET: http://backend:8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: resume-parser
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: resume-parser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: qdrant-storage
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: resume-parser
spec:
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlist-agent
  namespace: resume-parser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shortlist-agent
  template:
    metadata:
      labels:
        app: shortlist-agent
    spec:
      containers:
        - name: shortlist-agent
          image: shortlist-agent:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["app.api.routes:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: shortlist-agent-config
          env:
            - name: HF_HOME
              value: /tmp/huggingface
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shortlist-agent
  namespace: resume-parser
spec:
  selector:
    app: shortlist-agent
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: resume-parser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: resume-parser-backend:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["app.api.routes:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: parser-backend-config
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: parser-backend-secret
                  key: GOOGLE_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1500m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: resume-parser
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: resume-parser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: resume-parser-frontend:local
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
          ports:
            - name: http
              containerPort: 5173
          envFrom:
            - configMapRef:
                name: parser-frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: resume-parser
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 5173
      targetPort: http
      nodePort: 30173
